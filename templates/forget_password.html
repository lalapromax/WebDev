{% extends "base.html" %}

    {% block content %}
    <div>
        <img src="/static/assets/default-background.png" class="background-img">
        <div class="form-card">
            <form method="POST" class="login-form" action ="/forget_password">
                <h1 class="big-title">Forget Password</h1>
                <div class="form-group">
                    <label>Email</label>
                    <span class="forget-password">Enter the email account your registered with.</span>
                    <input type="text" name="email" placeholder="Email" required>
                </div>
                <button type= "submit" name ="action" value="send_otp" class="login-btn">
                    Submit
                </button>
            </form>
            <form method="POST" class="login-form" action ="/forget_password">
                <div class="form-group">
                    <label>Reset your password</label>
                    <span class="forget-password">A 6 digit email OTP was sent to {{session['reset_email']}}.
                    Enter the code here to proceed.</span>
                    <input type="text" name="otp" placeholder="OTP" required>
                </div>
                <button type="submit" name ="action" value ="verify_otp" class="login-btn" href="">
                    Submit OTP
                </button>
            </form>
        </div>
        <div class="floating-items" id="floatingItems"></div>
    </div>
    {% endblock %}
