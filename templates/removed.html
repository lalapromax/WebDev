{% extends "base.html" %}

{% block content %}

<h1 class="edit-profile-title">Edit Profile</h1>

<div class="photo-section">

    <img src="/static/assets/sample_profile.jpg" class="profile-pic">

    <button class="shimmer-button">
        <span>Upload Photo</span>

        <div class="shimmer-effect">
            <div></div>
        </div>
    </button>

</div>

<div class="form-group">
    <label>Full Name</label>
    <input type="text"
           value="{{ Fullname or 'Tan Ming Rae' }}">
</div>

<div class="form-group">
    <label>Email</label>
    <input type="email"
           value="{{ Email or 'Tan Ming Rae' }}">
</div>

<div class="form-group">
    <label>Phone Number</label>
    <input type="text"
           value="{{ Phone or 'Tan Ming Rae' }}">
</div>

<div class="form-group">
    <label>Birthday</label>
    <input type="date"
           value="{{ Birthday or 'Tan Ming Rae' }}">
</div>

<div class="form-group">
    <label>Nationality</label>
    <input type="text"
           value="{{ Nationality or 'Tan Ming Rae' }}">
</div>

<div class="form-group">
    <label>Address</label>
    <textarea>{{ Address or 'Tan Ming Rae' }}</textarea>
</div>

<div class="profile-actions">

    <button class="discard-btn">
        Discard Changes
    </button>

    <button class="shimmer-button">
        <span>Save Profile</span>

        <div class="shimmer-effect">
            <div></div>
        </div>
    </button>

</div>

{% endblock %}
