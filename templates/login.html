{% if session['user'] %}
    {% extends "base.html" %}
{% else %}
    {% extends "general_base.html" %}
{% endif %}

    {% block content %}
    <div>
        <img src="/static/assets/default-background.png" class="background-img">
        <div class="form-card">
            <form method="POST" class="login-form">
                <h1 class="big-title">Login</h1>
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <a href="/forget-password" class="forgot-password">
                    Forgot Password? <b class="click-me-btn">Click Here</b>
                </a>
                <br>
                <div class="divider">
                    <hr>
                    <span>or sign in with</span>
                    <hr>
                </div>
                <div class="signin-icons">
                    <img class="signin-icon" src="/static/assets/google.png" onclick="window.location.href='/login/google'">
                    <img class="signin-icon" src="/static/assets/facebook.png" onclick="window.open('https://www.facebook.com', '_blank')">
                    <img class="signin-icon" src="/static/assets/twitter.png" onclick="window.open('https://www.twitter.com', '_blank')">
                </div>
            </form>
        </div>
        <div class="floating-items" id="floatingItems"></div>
    </div>
    {% endblock %}
