{% extends "admin-base.html" %}
{% block content %}

<h1 class="big-title">Admin Dashboard</h1>

<div>
  <label for="year-select">Year:</label>
  <select id="year-select">
    {% for y in available_years %}
      <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
    {% endfor %}
  </select>
</div>

<div>
  <canvas id="totalDonations"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  document.getElementById('year-select').addEventListener('change', (e) => {
    window.location.href = `?year=${e.target.value}`;
  });

  const ctx = document.getElementById('totalDonations');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: {{ month_names | tojson }},
      datasets: [{
        label: 'Total donations (RM) — {{ selected_year }}',
        data: {{ totalDonationData | tojson }},
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>


{% endblock %}
