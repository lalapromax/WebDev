{% extends "base.html" %}

    {% block content %}
    <div>
        <img src="/static/assets/default-background.png" class="background-img">
        <div class="form-card">
            <form method="POST" class="login-form">
                <h1 class="big-title">Reset Password</h1>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" placeholder="New Password" required>
                </div>
                <div class="form-group">
                    <label> Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="login-btn">Save Changes</button>
                <br>
                <div class="divider">
                    <hr>
                    <span>or sign in with</span>
                    <hr>
                </div>
                <div class="signin-icons">
                    <img class="signin-icon" src="/static/assets/google.png" onclick="window.location.href='/login/google'">
                    <img class="signin-icon" src="/static/assets/facebook.png" onclick="window.open('https://www.facebook.com', '_blank')">
                    <img class="signin-icon" src="/static/assets/twitter.png" onclick="window.open('https://www.twitter.com', '_blank')">
                </div>
            </form>
        </div>
        <div class="floating-items" id="floatingItems"></div>
    </div>
    {% endblock %}
</body>
