{% extends "base.html" %}

    {% block content %}
    <div>
        <img src="/static/assets/default-background.png" class="background-img">
        <div class="form-card">
            <form method="POST" class="login-form">
                <h1 class="big-title">Reset Password</h1>
                <div class="form-group">
                    <label>Old Password</label>
                    <input type="password" name="old_password" placeholder="Old Password" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" placeholder="New Password" required>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="login-btn">Save Changes</button>
                <br>
            </form>
        </div>
        <div class="floating-items" id="floatingItems"></div>
    </div>
    {% endblock %}
