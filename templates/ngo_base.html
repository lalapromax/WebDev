<!DOCTYPE html>
<html lang="en">
    <head>
        <title>base</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    </head>
    <body class="{% if request.path == '/' %}index-page{% elif request.path == '/register' %}form-background{% endif %}">
        <header>
            <nav>
                <a href="/">
                    <img src="/static/assets/MEDonate-Logo(White).png">
                </a>
                <div class="nav-links" id="navLinks">
                    <ul>
                        <i class="fa-solid fa-xmark" id="closeIcon" onclick="toggleMenu()"></i>
                        <li><a href="/profile">DASHBOARD</a></li>
                        <li><a href="/campaign-create">CREATE CAMPAIGNS</a></li>
                        <li><a href="/edit-profile">EDIT PROFILE</a></li>
                        <li><a href="/logout">LOGOUT</a></li>
                    </ul>
                </div>
                <i class="fa-solid fa-bars" id="menuIcon" onclick="toggleMenu()"></i>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>

        </footer>
        <div id="flashPopup" class="popup-overlay" hidden>
            <div class="popup-box"
                 role="alertdialog"
                 aria-modal="true"
                 aria-labelledby="popupTitle"
                 aria-describedby="popupMessage">

                <h2 id="popupTitle">Notice</h2>

                <p id="popupMessage"></p>

                <button type="button"
                        id="popupOkay"
                        onclick="closePopup()">
                    Okay
                </button>

            </div>
        </div>
        <script src="/static/main.js"></script>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                {% if category == "popup" %}
                    <script>
                        showPopup({{ message | tojson }});
                    </script>
                {% endif %}
            {% endfor %}
        {% endwith %}
    </body>
</html>
