{% if session['user'] %}
    {% extends "base.html" %}
{% else %}
    {% extends "general_base.html" %}
{% endif %}

    {% block content %}
    <div>
        <img src="/static/assets/contact_page_bg.jpg" class="background-img">
        <div class="form-card">
            <form method="POST" class="login-form">
                <h1 class="big-title">Contact Us</h1>
                <div class="form-group">
                    <label>Full Name</label>
                    <input id="fullname" type="text" name="fullname" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input id="email" type="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input id="phone" type="text" name="phone" placeholder="Phone Number">
                </div>
                <div class="form-group">
                    <label>Organization Name</label>
                    <input id="ngo" type="text" name="ngo" placeholder="NGO Name" required>
                </div>
                <button type="submit" class="login-btn">Send</button>
            </form>
        </div>
        <div class="floating-items" id="floatingItems"></div>
    </div>
    {% endblock %}
