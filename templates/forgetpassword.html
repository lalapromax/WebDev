{% extends "base.html" %}

{% block content %}

  <div>
        <img src="/static/assets/default-background.png" class="background-img">
        <div class="form-card">

            <!--SEND OTP FORM-->
            <form method="POST" action ="{{ url_for('forget_password') }}" class="login-form">
                <h1 class="big-title">Forget Password</h1>
                <div class="form-group">

                    <label>Email</label>
                    <small>Enter the email account your registered with.</small>
                    <input type="text" name="email" placeholder="Email" required>

                </div>
                 <button type= "submit" name ="action" value="send_otp" class="login-btn">
                    Send OTP
                </button>
            </form>

            <!--VERIFY OTP FORM-->
            <form method="POST" action="{{ url_for('forget_password') }}" class="login-form">

                <div class="form-group">
                    <label>Enter OTP</label>
                    <input type="text" name="otp" placeholder="OTP" required>
                </div>
                 <button type="submit" name ="action" value ="verify_otp" class="login-btn" href="">Submit OTP</button>
            </form>


        </div>
  </div>
{% endblock %}
