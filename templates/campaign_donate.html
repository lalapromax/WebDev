<h1>Donate</h1>

<form id="donate-form">
    <div class="field">
        <label for="amount">Amount (MYR)</label>
        <input type="number" id="amount" name="amount" min="1" step="0.01" required>
    </div>

    <div class="field">
        <label for="message">Message (optional)</label>
        <textarea id="message" name="message" maxlength="500" rows="3"></textarea>
    </div>

<!--    <div class="field">-->
<!--        <label>-->
<!--            <input type="checkbox" id="anonymous" name="anonymous">-->
<!--            Donate anonymously-->
<!--        </label>-->
<!--    </div>-->

    <button type="submit">Continue to payment</button>
</form>

<div id="checkout-container"></div>

<style>
    .field { margin-bottom: 1rem; }
    .field label { display: block; margin-bottom: 0.25rem; }
    #checkout-container { margin-top: 1.5rem; }
</style>

<script src="https://js.stripe.com/endive/stripe.js"></script>
<script>
    const stripe = Stripe("{{ stripe_publishable_key }}");
    const form = document.getElementById("donate-form");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const submitButton = form.querySelector("button[type=submit]");
        submitButton.disabled = true;

        try {
            const params = new URLSearchParams({
                amount: document.getElementById("amount").value,
                message: document.getElementById("message").value,
            });

            const response = await fetch(window.location.pathname, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: params.toString(),
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Something went wrong.");
            }

            form.style.display = "none";

            const checkout = await stripe.createEmbeddedCheckoutPage({
                fetchClientSecret: async () => data.clientSecret,
            });
            checkout.mount("#checkout-container");
        } catch (err) {
            alert(err.message);
            submitButton.disabled = false;
        }
    });
</script>
