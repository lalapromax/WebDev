{% extends "base.html" %}

<body>
    {% block content %}
    <div>
        <img src="/static/assets/contact_page_bg.jpg" class="background-img">
        <div class="form-card">
            <form method="POST" class="login-form">
                <h1 class="big-title">Register</h1>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input name="confirm_password" type="password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div class="divider">
                    <hr>
                    <span>or sign in with</span>
                    <hr>
                </div>
                <div class="signin-icons">
                    <img class="signin-icon" src="/static/assets/google.png" onclick="window.location.href='/login/google'">
                    <img class="signin-icon" src="/static/assets/facebook.png" onclick="window.open('https://www.facebook.com', '_blank')">
                    <img class="signin-icon" src="/static/assets/twitter.png" onclick="window.open('https://www.twitter.com', '_blank')">
                </div>
            </form>
        </div>
        <div class="floating-items" id="floatingItems"></div>
    </div>
    {% endblock %}
</body>
