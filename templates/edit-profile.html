{% extends "base.html" %}

    {% block content %}
    <div>
        <img id="coverPreview"
             src="{{ user['background-pic'] or '/static/assets/adventuretime.jpg' }}"
             alt="Cover photo"
             class="profile-bg-img">

        <img id="profilePicPreview"
             src="{{ user['profile-pic'] or '/static/assets/sample_profile.jpg' }}"
             class="profile-pic">

        <div class="profile-card">
            <!-- CHANGED: extra class "edit-buttons" stacks the two buttons; both use .edit-profile-picture -->
            <div class="edit-profile-position edit-buttons">
                <button type="button"
                        class="edit-profile-picture"
                        onclick="document.getElementById('profilePicInput').click();">
                    Change Profile Picture&nbsp;&nbsp;
                    <i class="fa-solid fa-pen"></i>
                </button>
                <button type="button"
                        class="edit-profile-picture"
                        onclick="document.getElementById('coverInput').click();">
                    Change Cover Photo&nbsp;&nbsp;
                    <i class="fa-solid fa-image"></i>
                </button>
            </div>

            <!-- CHANGED: title block moved out of the form, same wrapper class as profile.html -->
            <div class="login-form">
                <div class="profile-info">
                    <h1 class="profile-name">Edit Profile</h1>
                    <hr class="profile-divider">
                </div>
            </div>

            <!-- CHANGED: extra class "edit-form" so it can be ordered/sized separately -->
            <form method="POST" class="login-form edit-form" enctype="multipart/form-data">

                <input type="file"
                       id="profilePicInput"
                       name="profile-pic"
                       accept="image/png, image/jpeg, image/webp"
                       hidden>

                <input type="file"
                       id="coverInput"
                       name="background-pic"
                       accept="image/png, image/jpeg, image/webp"
                       hidden>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text"
                           name="name"
                           value="{{ user['name'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           value="{{ user['email'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel"
                           inputmode="numeric"
                           pattern="[0-9]{10,11}"
                           name="phone-no"
                           value="{{ user['phone-no'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Birthday</label>
                    <input type="date"
                           name="DOB"
                           value="{{ user['donor_details']['DOB'] or '' }}">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <select name="state" required>
                        <option value="" disabled
                                {% if not user['donor_details']['state'] %}selected{% endif %}>
                            Select a state
                        </option>
                        {% for s in states %}
                        <option value="{{ s }}"
                                {% if (user['donor_details']['state'] or '')|lower == s|lower %}selected{% endif %}>
                            {{ s }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address">{{ user['address'] or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password"
                           value="**************" readonly>
                    <div>
                        <span>Want to reset your password? <b class="click-me-btn" onclick="window.location.href='/reset-password'">Click Here!</b></span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button type="button" class="general-btn warning-btn" onclick="if(confirm('Are you sure you want to discard your changes?')) window.location.href='/profile';">
                        Discard Changes
                    </button>

                    <button type="submit" class="general-btn save-btn">
                        <span>Save Profile</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="profile-bottom-space"></div>

        <div class="ngo-profile-card">
            <img src="{{ user['profile-pic'] or '/static/assets/sample_profile.jpg' }}"
                 class="ngo-profile-pic">

            <div class="edit-ngo-profile-position edit-ngo-buttons">
                <button type="button"
                        class="edit-profile-picture edit-ngo-profile-picture"
                        onclick="document.getElementById('profilePicInput').click();">
                    Change Profile Picture&nbsp;&nbsp;
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            <div class="login-form">
                <div class="ngo-profile-info">
                    <h1 class="profile-name ngo-profile-name">Edit NGO Profile</h1>
                    <hr class="profile-divider profile-divider-white">
                </div>
            </div>

            <form method="POST" action="/edit-ngo-profile" class="login-form edit-form">
                <div class="form-group">
                    <label class="ngo">Registered Organization Name</label>
                    <input class="ngo"
                           type="text"
                           name="name"
                           value="{{ user['name'] or '' }}">
                </div>

                <div class="form-group">
                    <label class="ngo">ROS Registration Number / SSM Registration Number</label>
                    <input class="ngo"
                           type="text"
                           name="id"
                           value="{{ user['id'] or '' }}">
                </div>

                <div class="form-group">
                    <label class="ngo">Organization Phone Number</label>
                    <input class="ngo"
                           type="tel"
                           inputmode="numeric"
                           pattern="[0-9]{10,11}"
                           name="phone-no"
                           value="{{ user['phone-no'] or '' }}">
                </div>

                <div class="form-group">
                    <label class="ngo">Organization Email</label>
                    <input class="ngo"
                           type="email"
                           name="email"
                           value="{{ user['email'] or '' }}">
                </div>

                <div class="form-group">
                    <label class="ngo">Instagram Handle</label>
                    <input class="ngo"
                           type="text"
                           name="instagram"
                           value="{{ user['instagram'] or '' }}">
                </div>

                <div class="form-group">
                    <label class="ngo">Facebook Handle</label>
                    <input class="ngo"
                           type="text"
                           name="facebook"
                           value="{{ user['facebook'] or '' }}">
                </div>

                <div class="form-group">
                    <label class="ngo">Tik Tok</label>
                    <input class="ngo"
                           type="text"
                           name="tiktok"
                           value="{{ user['tiktok'] or '' }}">
                </div>

                <div class="form-group">
                    <label class="ngo">Organization Address</label>
                    <textarea class="ngo" name="address">{{ user['address'] or '' }}</textarea>
                </div>

                <div class="profile-actions">
                    <button type="button" class="general-btn ngo-warning-btn" onclick="if(confirm('Are you sure you want to discard your changes?')) window.location.href='/profile';">
                        Discard Changes
                    </button>

                    <button type="submit" class="ngo-save-btn">
                        <span>Save Profile</span>
                    </button>
                </div>
            </form>
        </div>
        <div class="profile-bottom-space"></div>
    </div>
    {% endblock %}
