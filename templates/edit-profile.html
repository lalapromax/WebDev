{% extends "base.html" %}

    {% block content %}
    <div>
        <img src="/static/assets/adventuretime.jpg" alt="Profile Picture" class="profile-bg-img">
        <img src="{{ user['profile-pic'] or '/static/assets/sample_profile.jpg'  }}" class="profile-pic">
        <div class="profile-card">
            <div class="edit-profile-position">
                <button
                    class="edit-profile-picture"
                    onclick="location.href='/edit-profile';">
                    Change Profile Picture&nbsp;&nbsp;
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            <form method="POST" class="login-form">
                <div class="profile-info">
                    <h1 class="profile-name">Edit Profile</h1>
                    <hr class="profile-divider">
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text"
                           name="name"
                           value="{{ user['name'] or '' }}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           value="{{ user['email'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password"
                           value="**************" readonly>
                </div>
               <button type="button" class="discard-btn" onclick="window.location.href='/reset-password'">
                    Reset Password
               </button>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel"
                           inputmode="numeric"
                           pattern="[0-9]{10,11}"
                           name="phone-no"
                           value="{{ user['phone-no'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Birthday</label>
                    <input type="date"
                           name="DOB"
                           value="{{ user['donor_details']['DOB'] or '' }}">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input type="text"
                           name="state"
                           value="{{ user['donor_details']['state'] or '' }}">
                </div>


                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address">{{ user['address'] or '' }}</textarea>
                </div>

                <div class="profile-actions">

                    <button type = "button" class="discard-btn" onclick="if(confirm('Are you sure you want to discard your changes?')) window.location.href='/profile';">
                        Discard Changes
                    </button>

                    <button type="submit" class="shimmer-button">
                        <span>Save Profile</span>
                        <div class="shimmer-effect"><div></div></div>

                    </button>

                </div>
            </form>


        </div>
    <div class="profile-bottom-space"></div>
    </div>
    {% endblock %}
</body>
